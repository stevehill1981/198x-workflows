name: Release PR

# Fails a release pull request that bumps a manifest version without adding a
# matching `## [x.y.z]` changelog heading.
#
# Release PRs (titles starting `chore` and mentioning `release`, as release-plz
# and Emu198x's maintain-release write them) must carry an authored changelog
# entry for every version they set (umbrella decisions/releasing-published-crates.md).
# Every other pull request skips the job.
#
#   on:
#     pull_request:
#       types: [opened, edited, reopened, synchronize]
#   jobs:
#     release-pr:
#       uses: stevehill1981/198x-workflows/.github/workflows/release-pr.yml@v1

on:
  workflow_call:

permissions:
  contents: read

jobs:
  changelog-version:
    name: Released versions have changelog entries
    if: startsWith(github.event.pull_request.title, 'chore') && contains(github.event.pull_request.title, 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff is against the base commit, which may be far behind.
          fetch-depth: 0
          persist-credentials: false
      - name: Match manifest versions to added changelog headings
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          versions="$({
            git diff --unified=0 "$BASE_SHA" -- '**/Cargo.toml' Cargo.toml |
              sed -nE 's/^\+version = "([0-9]+\.[0-9]+\.[0-9]+).*"$/\1/p'
          } | sort -u)"

          changelog_diff="$(git diff --unified=0 "$BASE_SHA" -- '**/CHANGELOG.md' CHANGELOG.md)"
          if [[ -z "$versions" ]]; then
            grep -Eq '^\+## \[[0-9]+\.[0-9]+\.[0-9]+\]' <<<"$changelog_diff" || {
              echo 'Release PR adds neither a manifest version nor a versioned changelog heading.' >&2
              exit 1
            }
            exit 0
          fi
          while IFS= read -r version; do
            if ! grep -Fq "+## [$version]" <<<"$changelog_diff"; then
              echo "Release PR changes a manifest to $version but adds no '## [$version]' changelog heading." >&2
              exit 1
            fi
            echo "OK $version has a changelog heading"
          done <<<"$versions"
