name: Workflow lint

# actionlint checks a repository's workflows, and with shellcheck every `run:`
# script in them. It reads the repository's own .github/actionlint.yaml, which
# is where findings in generated files (such as dist's release workflow) are
# accepted, with the reason.
#
# rust-ci.yml and pages-astro.yml run this, so repositories using them need no
# caller. Others call it directly:
#
#   jobs:
#     workflows:
#       uses: stevehill1981/198x-workflows/.github/workflows/workflow-lint.yml@v1
#
# Run the same check locally with `actionlint` from the repository root, with
# shellcheck 0.11.0 installed.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The release binary, checked against the release's own checksums. The
      # version is pinned so a new actionlint check cannot fail an unrelated
      # PR. Dependabot doesn't track it, so bump it by hand.
      - name: Install actionlint
        env:
          VERSION: 1.7.12
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${VERSION}"
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 3 -o "$archive" "$base/$archive"
          curl -sSfL --retry 3 -o checksums.txt "$base/actionlint_${VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # actionlint checks run: scripts only when shellcheck is on the path, and
      # shellcheck versions disagree: the runner image's 0.9.0 flags code that
      # 0.11.0 accepts. Pinning the version a local `brew install shellcheck`
      # gives keeps a clean local run clean here. The project publishes no
      # checksums, so the SHA-256 is the one recorded from the release asset
      # on 2026-10-20.
      - name: Install shellcheck
        env:
          VERSION: 0.11.0
          SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="shellcheck-v${VERSION}.linux.x86_64.tar.xz"
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 3 -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${VERSION}/$archive"
          echo "$SHA256  $archive" | sha256sum -c -
          tar -xJf "$archive" --strip-components=1 "shellcheck-v${VERSION}/shellcheck"

      - name: Every workflow must pass actionlint
        run: |
          shellcheck --version | sed -n 2p
          actionlint -version | head -1
          actionlint -color
