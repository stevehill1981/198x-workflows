name: Rust CI

# The universal CI core every 198x Rust repo runs (umbrella
# decisions/project-skeleton-standard.md): format, Clippy, coverage (which is
# also the test run, with a floor), and a build and test on macOS and Windows.
# Project-specific jobs stay in the calling ci.yml beside this call.
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
#   concurrency:
#     group: ci-${{ github.event.pull_request.number || github.ref }}
#     cancel-in-progress: true
#   jobs:
#     rust:
#       name: Rust
#       uses: stevehill1981/198x-workflows/.github/workflows/rust-ci.yml@v1
#       with:
#         coverage-floor: 75
#
# The toolchain comes from rust-toolchain.toml; edit the pin there only.

on:
  workflow_call:
    inputs:
      coverage:
        description: Run the coverage job, which is also the Linux test run. Off only where a repo runs its own test job.
        type: boolean
        default: true
      coverage-floor:
        description: Line coverage (%) below which the coverage job fails. Ratchet it up; never down.
        type: number
        default: 50
      coverage-args:
        description: Extra arguments for `cargo llvm-cov`, such as `--lib --tests`.
        type: string
        default: ''
      clippy-args:
        description: Arguments for `cargo clippy`.
        type: string
        default: '--workspace --all-targets -- -D warnings'
      platform-test:
        description: Run `cargo test --workspace` on macOS and Windows as well as `cargo check`.
        type: boolean
        default: true
      linux-packages:
        description: Space-separated apt packages the Linux jobs need, such as `libasound2-dev libudev-dev`.
        type: string
        default: ''
      all-features:
        description: Also run Clippy and the tests with `--all-features`.
        type: boolean
        default: false
      coverage-setup-command:
        description: Shell command run in the coverage job before the tests, such as fetching a pinned fixture repo.
        type: string
        default: ''
      platform-build:
        description: Run the macOS and Windows build job. Off only where a repo builds those platforms itself.
        type: boolean
        default: true
      workflow-lint:
        description: Lint the repository's workflows with actionlint (workflow-lint.yml). Off only where a repo runs its own.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read pinned toolchain
        id: toolchain
        run: echo "channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Bounded: an unreachable mirror otherwise stalls apt for twenty minutes
      # or more and looks like a hang (Emu198x's check-workflow-apt.py rule).
      - name: Install Linux packages
        if: inputs.linux-packages != ''
        env:
          PACKAGES: ${{ inputs.linux-packages }}
        run: |
          apt_opts=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          read -ra packages <<< "$PACKAGES"
          # apt moves down the runner's mirror list only on an error, so a slow
          # Azure mirror would fail every attempt. Each retry puts another
          # mirror first (amd64 runners using /etc/apt/apt-mirrors.txt only;
          # Emu198x's scripts/ci/apt-install.sh does the same).
          list=/etc/apt/apt-mirrors.txt
          fallbacks=(http://archive.ubuntu.com/ubuntu/ http://mirrors.edge.kernel.org/ubuntu/)
          rotates=false
          if [ -f "$list" ] && [ "$(dpkg --print-architecture)" = amd64 ] \
            && grep -rqs "mirror+file:$list" /etc/apt/sources.list /etc/apt/sources.list.d; then
            rotates=true
            sudo cp "$list" "$list.runner"
          fi
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ] && [ "$rotates" = true ]; then
              first=${fallbacks[attempt - 2]}
              {
                printf '%s\tpriority:1\n' "$first"
                grep -v -F "$first" "$list.runner" | awk -F'\t' '{ print $1 "\tpriority:" NR + 1 }'
              } | sudo tee "$list" > /dev/null
              echo "apt: mirror $first first"
            fi
            sudo timeout 120 apt-get "${apt_opts[@]}" update \
              || echo "::warning::apt-get update attempt ${attempt} incomplete (mirror unreachable)"
            if sudo timeout 180 apt-get "${apt_opts[@]}" install -y --no-install-recommends "${packages[@]}"; then
              exit 0
            fi
            echo "::warning::apt-get install attempt ${attempt} failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::could not install: $PACKAGES"
          exit 1
      - name: Read pinned toolchain
        id: toolchain
        run: echo "channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run Clippy
        env:
          ARGS: ${{ inputs.clippy-args }}
        run: eval "cargo clippy $ARGS"
      - name: Run Clippy with all features
        if: inputs.all-features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Coverage is also the test run: cargo-llvm-cov compiles and runs every test
  # under instrumentation, so one pass gives the regression signal and the
  # coverage figure. It waits for fmt and Clippy, so a quick lint failure
  # doesn't pay for the instrumented build.
  coverage:
    name: Coverage
    if: inputs.coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Bounded: an unreachable mirror otherwise stalls apt for twenty minutes
      # or more and looks like a hang (Emu198x's check-workflow-apt.py rule).
      - name: Install Linux packages
        if: inputs.linux-packages != ''
        env:
          PACKAGES: ${{ inputs.linux-packages }}
        run: |
          apt_opts=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          read -ra packages <<< "$PACKAGES"
          # apt moves down the runner's mirror list only on an error, so a slow
          # Azure mirror would fail every attempt. Each retry puts another
          # mirror first (amd64 runners using /etc/apt/apt-mirrors.txt only;
          # Emu198x's scripts/ci/apt-install.sh does the same).
          list=/etc/apt/apt-mirrors.txt
          fallbacks=(http://archive.ubuntu.com/ubuntu/ http://mirrors.edge.kernel.org/ubuntu/)
          rotates=false
          if [ -f "$list" ] && [ "$(dpkg --print-architecture)" = amd64 ] \
            && grep -rqs "mirror+file:$list" /etc/apt/sources.list /etc/apt/sources.list.d; then
            rotates=true
            sudo cp "$list" "$list.runner"
          fi
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ] && [ "$rotates" = true ]; then
              first=${fallbacks[attempt - 2]}
              {
                printf '%s\tpriority:1\n' "$first"
                grep -v -F "$first" "$list.runner" | awk -F'\t' '{ print $1 "\tpriority:" NR + 1 }'
              } | sudo tee "$list" > /dev/null
              echo "apt: mirror $first first"
            fi
            sudo timeout 120 apt-get "${apt_opts[@]}" update \
              || echo "::warning::apt-get update attempt ${attempt} incomplete (mirror unreachable)"
            if sudo timeout 180 apt-get "${apt_opts[@]}" install -y --no-install-recommends "${packages[@]}"; then
              exit 0
            fi
            echo "::warning::apt-get install attempt ${attempt} failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::could not install: $PACKAGES"
          exit 1
      - name: Read pinned toolchain
        id: toolchain
        run: echo "channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Prepare the tests
        if: inputs.coverage-setup-command != ''
        env:
          COMMAND: ${{ inputs.coverage-setup-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Run the tests under coverage
        env:
          ARGS: ${{ inputs.coverage-args }}
        run: |
          set -euo pipefail
          mkdir -p target/llvm-cov
          # --no-fail-fast keeps the coverage data complete; the test status
          # still decides the job, below.
          status=0
          eval "cargo llvm-cov --workspace $ARGS --no-fail-fast --no-report" || status=$?
          cargo llvm-cov report | tee target/llvm-cov/coverage-summary.txt
          cargo llvm-cov report --json --summary-only --output-path target/llvm-cov/coverage-summary.json
          cargo llvm-cov report --lcov --output-path target/llvm-cov/lcov.info
          if [ "$status" -ne 0 ]; then
            echo "::error::tests failed (exit $status); see above."
            exit "$status"
          fi
      - name: Run the tests with all features
        if: inputs.all-features
        run: cargo test --workspace --all-features
      - name: Enforce the coverage floor
        env:
          FLOOR: ${{ inputs.coverage-floor }}
        run: |
          python3 - "$FLOOR" <<'PY'
          import json, os, sys
          floor = float(sys.argv[1])
          lines = json.load(open("target/llvm-cov/coverage-summary.json"))["data"][0]["totals"]["lines"]
          pct = float(lines["percent"])
          summary = f"Line coverage {pct:.2f}% ({lines['covered']}/{lines['count']} lines), floor {floor:.1f}%"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"## Coverage\n\n{summary}\n")
          if pct < floor:
              print(f"::error::line coverage {pct:.2f}% is below the {floor:.1f}% floor")
              sys.exit(1)
          PY
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            target/llvm-cov/coverage-summary.txt
            target/llvm-cov/coverage-summary.json
            target/llvm-cov/lcov.info
          retention-days: 14

  build:
    name: Build (${{ matrix.os }})
    if: inputs.platform-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.os }}
      - name: Check the workspace
        run: cargo check --workspace --all-targets
      - name: Test the workspace
        if: inputs.platform-test
        run: cargo test --workspace
      - name: Test the workspace with all features
        if: inputs.platform-test && inputs.all-features
        run: cargo test --workspace --all-features

  # The repository's own workflow files, checked by the family's shared lint.
  # Independent of the other jobs, so a lint finding never holds up a build.
  workflows:
    name: Workflows
    if: inputs.workflow-lint
    uses: stevehill1981/198x-workflows/.github/workflows/workflow-lint.yml@v1
